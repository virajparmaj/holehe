name: "CodeQL"

# Inherited from upstream, which pinned codeql-action@v1 and actions/checkout@v2.
# GitHub retired CodeQL Action v1 on 18 January 2023, so the job failed at the
# Initialize step before analysing anything. Bumped to the supported majors, and
# given the security-events permission the action needs to upload results.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 11 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
