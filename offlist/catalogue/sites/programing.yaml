- id: replit
  domain: replit.com
  category: programing
  method: register
  frequent_rate_limit: true
  steps:
    - id: check
      method: POST
      url: https://replit.com/data/user/exists
      headers:
        Accept: application/json
        Content-Type: application/json
        X-Requested-With: XMLHttpRequest
        Origin: https://replit.com
      body:
        json: { email: "{email}" }
  rules:
    - when: { json: { path: exists, equals: true } }
      then: registered
    - when: { json: { path: exists, equals: false } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }

