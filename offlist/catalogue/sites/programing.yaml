- id: devrant
  domain: devrant.com
  category: programing
  method: register
  steps:
    - id: check
      method: POST
      url: https://devrant.com/api/users
      headers:
        Accept: "application/json, text/javascript, */*; q=0.01"
        Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
        X-Requested-With: XMLHttpRequest
        Origin: https://devrant.com
        Referer: "https://devrant.com/feed/top/month?login=1"
      body:
        form:
          app: "3"
          type: "1"
          email: "{email}"
          username: ""
          password: ""
          guid: ""
          plat: "3"
          sid: ""
          seid: ""
  rules:
    - when:
        json:
          path: error
          equals: "The email specified is already registered to an account."
      then: registered
    - when: { json: { path: error, exists: true } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }

