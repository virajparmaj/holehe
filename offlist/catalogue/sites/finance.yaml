# finance -- financial services, crypto exchanges, fintech.

- id: paypal
  domain: paypal.com
  category: finance
  method: register
  steps:
    - id: check
      method: POST
      url: https://www.paypal.com/signup/api/check-email
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://www.paypal.com"
        Referer: "https://www.paypal.com/signin"
      body:
        json: { email: "{email}" }
  rules:
    - when: { body: { contains: "ACCOUNT_EXISTS" } }
      then: registered
    - when: { status: { eq: 200 } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

