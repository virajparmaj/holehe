- id: binance
  domain: binance.com
  category: finance
  method: register
  steps:
    - id: check
      method: POST
      url: https://accounts.binance.com/bapi/accounts/v1/public/account/email/check
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://accounts.binance.com"
        Referer: "https://accounts.binance.com/register"
      body:
        json: { email: "{email}" }
  rules:
    - when: { json: { path: data.exist, equals: true } }
      then: registered
    - when: { json: { path: data.exist, equals: false } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

