- id: plurk
  domain: plurk.com
  category: social_media
  method: register
  steps:
    - id: check
      method: POST
      url: https://www.plurk.com/Users/isEmailFound
      headers:
        Accept: "*/*"
        Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
        X-Requested-With: XMLHttpRequest
        Origin: https://www.plurk.com
      body:
        form: { email: "{email}" }
  rules:
    - when: { body: { equals: "True" } }
      then: registered
    - when: { body: { equals: "False" } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }

