- id: xvideos
  domain: xvideos.com
  category: porn
  method: register
  steps:
    - id: check
      method: GET
      url: https://www.xvideos.com/account/checkemail
      params: { email: "{email}" }
      headers:
        Accept: "application/json, text/javascript, */*; q=0.01"
        X-Requested-With: XMLHttpRequest
        Referer: https://www.xvideos.com/
  rules:
    - when:
        all:
          - json: { path: result, equals: false }
          - body:
              contains: "This email is already in use or its owner has excluded it from our website"
      then: registered
    - when: { json: { path: result, exists: true } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }

- id: onlyfans
  domain: onlyfans.com
  category: porn
  method: register
  steps:
    - id: check
      method: POST
      url: https://onlyfans.com/api2/v2/users/registration/check/email
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://onlyfans.com"
        Referer: "https://onlyfans.com/"
      body:
        json: { email: "{email}" }
  rules:
    - when: { body: { contains: "taken" } }
      then: registered
    - when: { status: { eq: 200 } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

