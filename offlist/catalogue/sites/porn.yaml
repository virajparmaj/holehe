- id: xnxx
  domain: xnxx.com
  category: porn
  method: register
  plugin: legacy
  frequent_rate_limit: true
  canary: { tier: c, discriminating: "yes" }

- id: xvideos
  domain: xvideos.com
  category: porn
  method: register
  steps:
    - id: check
      method: GET
      url: https://www.xvideos.com/account/checkemail
      params: { email: "{email}" }
      headers:
        Accept: "application/json, text/javascript, */*; q=0.01"
        X-Requested-With: XMLHttpRequest
        Referer: https://www.xvideos.com/
  rules:
    - when:
        all:
          - json: { path: result, equals: false }
          - body:
              contains: "This email is already in use or its owner has excluded it from our website"
      then: registered
    - when: { json: { path: result, exists: true } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }
