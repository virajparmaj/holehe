- id: khanacademy
  domain: khanacademy.org
  category: learning
  method: register
  steps:
    - id: check
      method: POST
      url: https://www.khanacademy.org/api/internal/graphql/checkEmail
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://www.khanacademy.org"
        Referer: "https://www.khanacademy.org/signup"
      body:
        json:
          query: "query checkEmail($email: String!) { user(email: $email) { id } }"
          variables: { email: "{email}" }
  rules:
    - when: { json: { path: "data.user.id", truthy: true } }
      then: registered
    - when: { json: { path: "data.user", exists: true } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }
