# ai -- AI tools and platforms.
# These sites collect emails for AI product signups. Many harvest data
# aggressively and are high-priority for privacy audits.

- id: huggingface
  domain: huggingface.co
  category: ai
  method: register
  steps:
    - id: check
      method: POST
      url: https://huggingface.co/join
      headers:
        Accept: "application/json"
        Content-Type: "application/x-www-form-urlencoded"
        Referer: "https://huggingface.co/join"
      body:
        form: { email: "{email}" }
  rules:
    - when: { body: { contains: "email is already" } }
      then: registered
    - when: { body: { contains: "email" } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

