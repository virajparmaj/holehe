- id: wandb
  domain: wandb.ai
  category: ai
  method: register
  steps:
    - id: check
      method: POST
      url: https://api.wandb.ai/graphql
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://wandb.ai"
        Referer: "https://wandb.ai/signup"
      body:
        json:
          query: "query CheckEmail($email: String!) { userByEmail(email: $email) { id } }"
          variables: { email: "{email}" }
  rules:
    - when: { json: { path: "data.userByEmail.id", truthy: true } }
      then: registered
    - when: { json: { path: "data.userByEmail", exists: true } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

