- id: insightly
  domain: insightly.com
  category: crm
  method: register
  steps:
    - id: check
      method: POST
      url: https://accounts.insightly.com/signup/isemailvalid
      headers:
        Accept: "application/json, text/javascript, */*; q=0.01"
        Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
        X-Requested-With: XMLHttpRequest
        Origin: https://accounts.insightly.com
        Referer: "https://accounts.insightly.com/?plan=trial"
      body:
        form: { emailaddress: "{email}" }
  rules:
    - when:
        body: { contains: "An account exists for this address. Use another address or" }
      then: registered
    - when: { body: { equals: "true" } }
      then: not_registered
  canary: { tier: c, discriminating: "yes" }

