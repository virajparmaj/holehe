# ecommerce -- major e-commerce platforms not in shopping.yaml.

- id: etsy
  domain: etsy.com
  category: ecommerce
  method: register
  steps:
    - id: check
      method: POST
      url: https://www.etsy.com/api/v3/ajax/member/check-email
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://www.etsy.com"
        Referer: "https://www.etsy.com/join"
        X-Detected-Locale: "USD|en-US|US"
      body:
        json: { email: "{email}" }
  rules:
    - when: { body: { contains: "exists" } }
      then: registered
    - when: { status: { eq: 200 } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

