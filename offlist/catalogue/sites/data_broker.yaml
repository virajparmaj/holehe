# data_broker -- people search and data broker sites.
# These are high-priority for privacy audits: they profile people
# who never signed up. Signup/claim-profile endpoints often leak
# whether an email is in their database.

- id: beenverified
  domain: beenverified.com
  category: data_broker
  method: register
  steps:
    - id: check
      method: POST
      url: https://www.beenverified.com/api/signup/check-email
      headers:
        Accept: "application/json"
        Content-Type: "application/json"
        Origin: "https://www.beenverified.com"
        Referer: "https://www.beenverified.com/signup"
      body:
        json: { email: "{email}" }
  rules:
    - when: { body: { contains: "already" } }
      then: registered
    - when: { status: { eq: 200 } }
      then: not_registered
  canary: { tier: c, discriminating: "unverified" }

