  socialcatfish:
    kind: opt_out_form
    url: https://socialcatfish.com/opt-out/
    requires_identity_proof: false
    requires_email_confirmation: true
    drop_covered: true
    estimated_effort_minutes: 5
    recheck_after_days: 45
    notes: >
      Pick your state, enter name and email, submit. The site says a record is
      removed from sale within 15 days.
