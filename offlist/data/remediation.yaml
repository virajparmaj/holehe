      auto-verified -- confirm in a browser first.
    source: yaelwrites/Big-Ass-Data-Broker-Opt-Out-List

  # ------------------------------------------------------- accounts you hold
  gravatar:
    kind: self_serve_delete
    url: https://gravatar.com/profiles/edit/
    estimated_effort_minutes: 5
    notes: >
      A Gravatar profile is public to anyone holding your address. You can make it
      private or delete it from the profile settings; deleting the WordPress.com
      account behind it removes it entirely.
    verified: 2026-08-18

  google:
