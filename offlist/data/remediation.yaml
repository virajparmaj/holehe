  instantcheckmate:
    kind: opt_out_form
    url: https://www.instantcheckmate.com/opt-out/
    requires_email_confirmation: true
    drop_covered: true
    estimated_effort_minutes: 10
    recheck_after_days: 45
    notes: >
      Search for the record, select it, confirm by email. URL from the community
      opt-out list; the broker returns 403 to automated checks, so it was not
      auto-verified -- open it in a browser before relying on it.
    source: yaelwrites/Big-Ass-Data-Broker-Opt-Out-List

  truthfinder:
    kind: opt_out_form
    url: https://www.truthfinder.com/opt-out/
    requires_email_confirmation: true
    drop_covered: true
    estimated_effort_minutes: 10
    recheck_after_days: 45
    notes: >
      Same PeopleConnect flow as Intelius: find the record, confirm by email. URL
      from the community opt-out list; the broker returns 403 to automated checks,
      so it was not auto-verified -- confirm in a browser first.
    source: yaelwrites/Big-Ass-Data-Broker-Opt-Out-List

  nuwber:
    kind: opt_out_form
    url: https://nuwber.com/removal/link
